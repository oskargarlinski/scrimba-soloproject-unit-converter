<html>
  <head>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="main-container">
      <section class="top-section">
        <h1>Metric/Imperial Unit Conversion</h1>
        <input type="number" id="inputValue" placeholder="#" />
        <button id="convertButton">Convert</button>
      </section>
      <section class="bottom-section">
        <div id="lengthConversion" class="conversion-container">
          <h2>Length (Meter/Feet)</h2>
          <p id="lengthResult">Placeholder Text</p>
        </div>
        <div id="volumeConversion" class="conversion-container">
          <h2>Volume (Liters/Gallons)</h2>
          <p id="volumeResult">Placeholder Text</p>
        </div>
        <div id="massConversion" class="conversion-container">
          <h2>Mass (Kilograms/Pounds)</h2>
          <p id="massResult">Placeholder Text</p>
        </div>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
